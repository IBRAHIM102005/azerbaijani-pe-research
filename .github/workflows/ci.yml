name: CI

# CI runs only CPU-compatible checks: lint, unit+integration tests,
# config drift audit, parameter fairness audit, and release verification.
# It NEVER launches full pretraining, the 25-run experiment matrix, or any
# GPU job -- see Makefile::reproduce-training for that, which is
# intentionally excluded here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git status`/commit metadata is meaningful

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-reproducibility.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-reproducibility.txt ]; then \
            grep -v '^torch' requirements-reproducibility.txt | grep -v '^#' | grep -v '^$' > /tmp/reqs-no-torch.txt; \
            pip install -r /tmp/reqs-no-torch.txt; \
            pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"; \
          else echo "No pinned dependency file found (requirements-reproducibility.txt)"; exit 1; fi
          pip install pytest ruff

      - name: Lint (if configured)
        run: |
          if [ -f pyproject.toml ] || [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            ruff check .
          else
            echo "No lint config found; skipping."
          fi

      - name: Unit + integration tests
        run: python -m pytest tests -q

      - name: Configuration drift audit (Yasin's ARM_ALLOWLIST + Ibrahim cross-check)
        run: python scripts/audit_configs.py --repo-root . --full

      - name: Parameter fairness audit (Yasin's fairness_report)
        run: python scripts/audit_parameters.py --repo-root .

      - name: Repository / release verification
        run: python scripts/verify_release.py --repo-root . --skip-tests --out release_verification.json

      - name: Upload release verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release_verification
          path: release_verification.json
